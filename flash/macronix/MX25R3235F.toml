# Macronix MX25R3235F 4MiB SPI flash.
# Datasheet: https://www.macronix.com/Lists/Datasheet/Attachments/8385/MX25R3235F,%20Wide%20Range,%2032Mb,%20v1.0.pdf
# By default its in lower power mode which can only do 8mhz. In high power mode it can do 80mhz.
#
# Read timing values are from the MX25R3235F datasheet Rev 1.8 (2021-03-03),
# Table 17, pages 68-71.
#
# This entry describes the parts with L in the ordering-code suffix (for example
# ...IL0), which start in ultra-low-power mode. Parts with H in the suffix start
# in high-performance mode. There, 0xeb runs at 80 MHz and output valid time is
# 8 ns.
total_size = 0x400000 # 4 MiB
start_up_time_us = 5000
manufacturer_id = 0xc2
memory_type = 0x28
capacity = 0x16
max_clock_speed_mhz = 8
eb_quad_read_max_clock_speed_mhz = 8
max_output_valid_ns = 12
min_output_hold_ns = 0
quad_enable_bit_mask = 0x40
has_sector_protection = false
