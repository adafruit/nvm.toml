# Macronix MX25L3206E 4MiB SPI flash.
# Datasheet: https://www.macronix.com/Lists/Datasheet/Attachments/7355/MX25L3206E,%203V,%2032Mb,%20v1.5.pdf
#
# Read timing values are from the MX25L3206E datasheet Rev 1.5 (2013-12-04),
# Table 9, page 34.
#
# No 0xeb or other quad read. The datasheet gives output valid time only for a
# 15 pF load (6 ns), so max_output_valid_ns is left out.
total_size = 0x400000 # 4 MiB
start_up_time_us = 5000
manufacturer_id = 0xc2
memory_type = 0x20
capacity = 0x16
eb_quad_read_max_clock_speed_mhz = 0
min_output_hold_ns = 0
