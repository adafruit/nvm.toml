# Macronix MX25L12833F 16MiB SPI flash
# Datasheet: https://www.macronix.com/Lists/Datasheet/Attachments/7447/MX25L12833F,%203V,%20128Mb,%20v1.0.pdf
#
# Read timing values are from the MX25L12833F datasheet Rev 1.0 (2017-10-17),
# Table 18, pages 76-77 and Table 10, page 32.
#
# At power-on, 0xeb runs at 84 MHz. 133 MHz needs 10 clocks after the address
# instead of 6, set by writing 11 to the DC bits (a dummy-clock setting in the
# configuration register).
total_size = 0x1000000 # 16 MiB
start_up_time_us = 5000
manufacturer_id = 0xc2
memory_type = 0x20
capacity = 0x18
max_clock_speed_mhz = 133
eb_quad_read_max_clock_speed_mhz = 84
max_output_valid_ns = 8
min_output_hold_ns = 1
quad_enable_bit_mask = 0x40
has_sector_protection = true
