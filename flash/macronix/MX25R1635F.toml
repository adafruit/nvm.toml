# Settings for the Macronix MX25R1635F 2MiB SPI flash.
# Datasheet: https://www.macronix.com/Lists/Datasheet/Attachments/7595/MX25R1635F,%20Wide%20Range,%2016Mb,%20v1.6.pdf
# In low power mode, quad operations can only run at 8 MHz.
#
# Read timing values are from the MX25R1635F datasheet Rev 1.6 (2018-12-12),
# Table 17, pages 68-71.
#
# This entry describes the parts with L in the ordering-code suffix (for example
# ...IL0), which start in ultra-low-power mode. Parts with H in the suffix start
# in high-performance mode. There, 0xeb runs at 80 MHz and output valid time is
# 8 ns.
total_size = 0x200000 # 2 MiB
start_up_time_us = 800
manufacturer_id = 0xc2
memory_type = 0x28
capacity = 0x15
max_clock_speed_mhz = 8 # 33 mhz for 1-bit operations
eb_quad_read_max_clock_speed_mhz = 8
max_output_valid_ns = 12
min_output_hold_ns = 0
quad_enable_bit_mask = 0x40
has_sector_protection = false
