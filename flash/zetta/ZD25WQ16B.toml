# Settings for the Zetta Device ZD25WQ16B 2MiB SPI flash.
# Datasheet: http://www.zettadevice.com/upload/file/pdf/ZD25WQ16B_datasheet.pdf
#
# Read timing values are from the ZD25WQ16B datasheet, Table 4-3 (AC
# characteristics), page 18.
#
# The AC characteristics table gives 85 MHz. The feature list's 104 MHz isn't
# backed by that table.
total_size = 0x200000 # 2 MiB
start_up_time_us = 12000
manufacturer_id = 0xba
memory_type = 0x60
capacity = 0x15
max_clock_speed_mhz = 85
eb_quad_read_max_clock_speed_mhz = 85
max_output_valid_ns = 7
min_output_hold_ns = 0
quad_enable_bit_mask = 0x02
has_sector_protection = false
