# Settings for the Winbond W25Q16FW 2MiB SPI flash.
# Datasheet: https://www.winbond.com/resource-files/w25q16fw%20revj%2005182017%20sfdp.pdf
#
# Read timing values are from the W25Q16FW datasheet Rev J (2017-05-18), AC
# characteristics, PDF page 78.
#
# This is a 1.8 V device. These values are for its 1.65-1.95 V supply.
total_size = 0x200000 # 2 MiB
start_up_time_us = 5000
memory_type = 0x60
capacity = 0x15
max_clock_speed_mhz = 133
eb_quad_read_max_clock_speed_mhz = 104
max_output_valid_ns = 6
min_output_hold_ns = 2
quad_enable_bit_mask = 0x02
quad_enable_status_byte = 2
write_status_register_split = false
6b_quad_read = true
32_qspi_write = true
