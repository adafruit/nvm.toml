# Settings for the Gigadevice GD25Q64C 8MiB SPI flash.
# Datasheet: http://www.elm-tech.com/en/products/spi-flash-memory/gd25q64/gd25q64.pdf
#
# Read timing values are from the GD25Q64C datasheet Rev 3.2, section 8.6,
# pages 55-56.
#
# 120 MHz needs the device's High Performance Mode, which a host turns on with
# command 0xa3. The 105 °C and 125 °C temperature grades have the same clock
# limits, but an output hold time of 0.7 ns.
total_size = 0x800000 # 8 MiB
capacity = 0x17
write_status_register_split = true
e7_quad_word_read = true
01_continuous_status_write = false
start_up_time_us = 5000
max_clock_speed_mhz = 104 # if we need 120 then we can turn on high performance mode
eb_quad_read_max_clock_speed_mhz = 104
max_output_valid_ns = 7
min_output_hold_ns = 1.2
