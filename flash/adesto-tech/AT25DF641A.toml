# Adesto Tech AT25DF641A 8MiB SPI flash
# used on the Oak Dev Tech Icy Tree M0 (SAMD21) feather board.
# Datasheet: https://www.adestotech.com/wp-content/uploads/doc8693.pdf
#
# Read timing values are from the AT25DF641A datasheet 8693G (2022-02),
# tables 14.4 and 14.5, page 49.
#
# No 0xeb or other quad read. Dual Output Read (0x3b) runs at up to 65 MHz.
total_size = 0x800000 # 8 MiB
memory_type = 0x48
capacity = 0x00
has_sector_protection = true
start_up_time_us = 10000
max_clock_speed_mhz = 85
eb_quad_read_max_clock_speed_mhz = 0
max_output_valid_ns = 5
min_output_hold_ns = 2
quad_enable_bit_mask = 0x00
write_status_register_split = false
6b_quad_read = false
32_qspi_write = false
