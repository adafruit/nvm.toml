# Datasheet: https://www.mouser.com/datasheet/3/1166/1/REN_AT25SF128A-168P_DST_20241112.pdf
#
# Read timing values are from the AT25SF128A datasheet Rev P (2024-11-13),
# Table 24, pages 49-50.
total_size = 0x1000000 # 16 MiB
memory_type = 0x89
capacity = 0x01
has_sector_protection = false

start_up_time_us = 300
max_clock_speed_mhz = 70
eb_quad_read_max_clock_speed_mhz = 120
max_output_valid_ns = 7
min_output_hold_ns = 0
quad_enable_bit_mask = 0x02
write_status_register_split = true
6b_quad_read = true
32_qspi_write = true
01_continuous_status_write = false
e7_quad_word_read = true
